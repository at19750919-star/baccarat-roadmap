<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>自然路</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Noto+Serif+TC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="luanlu.css?v=6">
  <style>
    main { width: 100%; }
    .road-grid { position: relative; }
    .road-guide { grid-row: 1 / 7; grid-column: 42; background: rgba(214, 170, 82, .16); }
    .workspace { grid-template-columns: minmax(0, 1fr); }
    .fields { grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); }
    .fields .wide { grid-column: span 2; }
    .actions { grid-template-columns: repeat(3, 150px); }
    @media (max-width: 560px) {
      .fields { grid-template-columns: minmax(0, 1fr); }
      .fields .wide { grid-column: auto; }
      .actions { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
  </style>
  <script src="ziranlu.js?v=10" defer></script>
</head>
<body>
  <main>
    <header><span class="crest" aria-hidden="true"></span><div class="header-copy"><h1>自然路</h1></div></header>
    <div class="workspace">
    <form id="settings">
      <fieldset>
        <legend>產生設定</legend>
        <div class="fields">
          <label class="row">條數<input name="count" type="number" min="1" max="100" value="5" required></label>
          <label class="row">局數(不含和)<input name="rounds" type="number" min="1" max="1000" value="82" required></label>
          <label class="row">莊閒差上限<input name="maxDifference" type="number" min="0" max="1000" value="4" placeholder="不限"></label>
          <label class="row">長龍上限<input name="maxRun" type="number" min="1" max="1000" value="6" placeholder="不限"></label>
          <label class="row cap-row"><span class="field-help" tabindex="0" aria-describedby="max-hole-length-help"><span class="term-red">洞</span>最長</span><span class="field-tooltip" id="max-hole-length-help" role="tooltip">連續單跳欄（洞）最多幾欄；填 4 就不能連續超過 4 欄，留空＝不限。這與「同長洞」限制相同長度出現幾次不同。</span><input name="maxHoleLength" type="number" min="0" max="1000" value="6" placeholder="不限" aria-describedby="max-hole-length-help"></label>
          <label class="row">重抽次數<input name="attempts" type="number" min="1" max="100000" value="60" required></label>
          <input type="hidden" name="perSideMax"><input type="hidden" name="combinedMax"><input type="hidden" name="holeMax"><input type="hidden" name="pillarMax"><input type="hidden" name="scoreMode" value="big"><input type="hidden" name="hillSteps" value="0"><input type="checkbox" name="randomMode" hidden><input type="checkbox" name="includeSingles" hidden>
          <label class="row">名稱前綴<input name="prefix" class="text" value="路單-AT" required></label>
          <label class="row">起始編號<input name="startNumber" type="number" min="0" max="1000000" value="1" required></label>
          <label class="row wide seed">種子<input name="seed" class="text" placeholder="選填，同設定同種子可重現" autocomplete="off"></label>
        </div>
        <div class="actions"><button type="submit">產生路單</button><button id="download" class="secondary" type="button" disabled>下載 JSON</button><button id="roadmap-image" class="secondary" type="button" disabled>路單圖</button></div>
        <div class="output-bar"><div class="progress-area"><p id="status" role="status" aria-live="polite">按「產生路單」開始。</p><progress id="progress" max="1" value="0" aria-label="產生進度"></progress></div></div>
        <p class="hint">先照自然比例抽欄長，再只調換同邊欄位的順序消除規律；只產生莊／閒不含和，同名匯入會覆蓋。</p>
      </fieldset>
    </form>
    <section id="results" aria-label="產生的路單" aria-busy="false"></section>
    </div>
  </main>
  <dialog id="roadmap-dialog" aria-label="路單圖">
    <div class="roadmap-toolbar">
      <span id="roadmap-status" role="status" aria-live="polite"></span>
      <button id="roadmap-copy" class="secondary" type="button">複製圖片</button>
      <button id="roadmap-close" class="secondary" type="button" autofocus>關閉</button>
    </div>
    <div id="roadmap-content" tabindex="0" aria-label="路單圖內容"></div>
  </dialog>
</body>
</html>
